x-common-defaults: &common_defaults
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "2"

services:
  auth_api:
    container_name: auth_api
    build:
      context: .
      dockerfile: Dockerfile
    image: auth_api_tests
    command: >
      sh -c "alembic -c /app/alembic.ini upgrade head &&
             gunicorn -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:8000 src_auth.main:app --no-control-socket"
    env_file:
      - .env
    ports:
      - 8000:8000
    depends_on:
      auth_redis:
        condition: service_healthy
      auth_database:
        condition: service_healthy
    <<: *common_defaults

  auth_database:
    image: postgres:17
    container_name: auth_database
    env_file:
      - .env
    volumes:
      - auth_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *common_defaults

  auth_redis:
    container_name: auth_redis
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *common_defaults

volumes:
  auth_database: