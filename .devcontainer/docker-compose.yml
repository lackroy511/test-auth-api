services:
  auth_api:
    container_name: auth_api_dev
    build:
      context: ..
      dockerfile: Dockerfile.dev
    command: tail -f /dev/null
    env_file:
      - ../.env
    volumes:
      - ..:/auth_api

  auth_database:
    image: postgres:17
    container_name: auth_database_dev
    env_file:
      - ../.env
    volumes:
      - auth_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_redis:
    container_name: auth_redis_dev
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  auth_database: